<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#18141f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Инициатива — ДНД</title>
<style>
:root{--bg:#18141f;--panel:#231d2e;--panel2:#2c2539;--line:#3b3249;--text:#ece6f2;--muted:#9a90aa;--brass:#e0a44a;--pc:#62b9a8;--npc:#d2675f;--tag:#4a3a66}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700;margin:0}
h1{font-size:26px;color:var(--brass)}
h2{font-size:19px;margin-bottom:12px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line)}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px;padding:20px 24px;max-width:1200px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr;padding:14px}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
button,input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 11px}
button{cursor:pointer}
button:hover{border-color:var(--brass)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.primary{background:var(--brass);color:#1d1508;border-color:var(--brass);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.round{color:var(--muted)}
.round b{color:var(--text);font-size:18px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(90px,1fr) 72px;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:8px;padding:9px 11px}
.row.npc{border-left-color:var(--npc)}
.row.off{opacity:.45}
.row.current{border-color:var(--brass);border-left-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.name{font-weight:600;overflow-wrap:anywhere}
.name small{color:var(--muted);font-weight:400;margin-left:6px}
.init{width:72px;text-align:center;font-size:18px;font-weight:700}
.absent{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:1200px;margin:0 auto;padding:4px 24px 28px;color:var(--muted);font-size:13px}
.absent:empty{display:none}
.absent button{font-size:13px;padding:3px 9px;color:var(--muted);background:transparent}
.ac{position:relative}
.aclist{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:5;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px;gap:0;max-height:200px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.aclist[hidden]{display:none}
.aclist li{padding:6px 9px;border-radius:4px;cursor:pointer}
.aclist li:hover,.aclist li.sel{background:var(--tag)}
.tag.has-note{border-radius:12px;text-align:left}
.tt{font-size:16px;font-weight:600}
.tn{display:block;font-size:13px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
@media(max-width:820px){.absent{padding:4px 14px 24px}}
.tags{grid-column:1 / 3;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tags:empty{display:none}
.tag{background:var(--tag);border:1px solid #6a55a0;border-radius:99px;padding:2px 10px;font-size:14px}
.tag:hover{border-color:var(--npc);text-decoration:line-through}
.del{padding:2px 8px;color:var(--npc)}
.empty{color:var(--muted);padding:8px 0}
label{display:block;margin:12px 0 5px;color:var(--muted);font-size:14px}
form{display:flex;gap:8px}
form input{flex:1;min-width:0}
select{width:100%}
.stack{display:flex;flex-direction:column;gap:6px}
.custom{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.custom .tag button{all:unset;cursor:pointer;margin-left:6px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.note{color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>Очередь инициативы</h1>
  <div class="bar">
    <span class="round">Раунд <b id="round">1</b></span>
    <button id="next">Следующий ход</button>
    <button class="primary" id="sort">Сортировать по инициативе</button>
    <button id="newFight" title="Убрать неписей, обнулить инициативу и состояния">Новый бой</button>
  </div>
</header>
<main>
  <section>
    <h2>Участники</h2>
    <ul id="list"></ul>
    <hr>
    <label for="newName">Добавить существо (НПС)</label>
    <form id="addForm">
      <input id="newName" placeholder="Например, Гоблин 1" autocomplete="off">
      <button class="primary" title="Добавить">+</button>
    </form>
    <p class="note">Крестик убирает существо из очереди. Игрока можно вернуть кнопкой «+ Имя» под списком, а НПС удаляется насовсем.</p>
  </section>
  <section>
    <h2>Состояния</h2>
    <label for="who">Существо</label>
    <select id="who"></select>
    <label for="cond">Состояние</label>
    <div class="ac">
      <input id="cond" placeholder="Выберите из списка или впишите своё" autocomplete="off" style="width:100%">
      <ul class="aclist" id="condList" hidden></ul>
    </div>
    <label for="tagNote">Заметка к состоянию (необязательно)</label>
    <div class="ac">
      <input id="tagNote" placeholder="Выберите из списка или впишите" autocomplete="off" style="width:100%">
      <ul class="aclist" id="acList" hidden></ul>
    </div>
    <div class="stack" style="margin-top:12px"><button class="primary" id="apply">Подтвердить</button></div>
    <p class="note">Клик по состоянию рядом с существом снимает его. Всё сохраняется в браузере автоматически.</p>
  </section>
</main>
<div class="absent" id="absent"></div>
<script>
var KEY = 'dnd-initiative-v1';
// ===== СПИСОК СОСТОЯНИЙ: правьте здесь (каждое в кавычках, через запятую) =====
var BASE = ['Ослеплён','Очарован','Оглох','Испуган','Схвачен','Недееспособен','Невидим','Парализован','Окаменел','Отравлен','Лежит ничком','Опутан','Ошеломлён','Без сознания','Истощение','Замедлен','Ускорен','Концентрация','Благословлён','Горит'];
// ===== ПОДСКАЗКИ ДЛЯ ПОЛЯ «ЗАМЕТКА К СОСТОЯНИЮ»: правьте здесь =====
var NOTES = ['1 мин','10 мин','до конца сл. хода','до начала сл. хода'];
var PCS = ['Ииска','Дариан','Амелия','Фил','Драуг'];

function fresh(){
  return {
    creatures: PCS.map(function(n,i){return {id:'pc'+i,name:n,pc:true,init:'',active:true,tags:[]};}),
    custom: [], turn: null, round: 1, seq: 0
  };
}
function load(){
  try{ var s = localStorage.getItem(KEY); if(s){ var d = JSON.parse(s); if(d && d.creatures){
      d.creatures.forEach(function(c){ c.tags = (c.tags||[]).map(function(t){ return typeof t==='string' ? {t:t,note:''} : t; }); });
      return d;
    } } }catch(e){}
  return fresh();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
var S = load();

var $ = function(id){return document.getElementById(id);};
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function find(id){return S.creatures.filter(function(c){return c.id===id;})[0];}

function render(){
  var present = S.creatures.filter(function(c){return c.active;});
  var html = present.map(function(c){
    var cls = 'row' + (c.pc?'':' npc') + (S.turn===c.id?' current':'');
    return '<li class="'+cls+'" data-id="'+c.id+'">'+
      '<span class="name">'+esc(c.name)+'<small>'+(c.pc?'игрок':'НПС')+'</small> '+
        '<button class="del" data-act="del" title="'+(c.pc?'Убрать из боя (нет на игре)':'Удалить')+'" aria-label="Убрать">×</button></span>'+
      '<input class="init" type="number" data-act="init" value="'+esc(String(c.init))+'" placeholder="—" aria-label="Инициатива">'+
      '<div class="tags">'+c.tags.map(function(t,i){return '<button class="tag'+(t.note?' has-note':'')+'" data-act="tag" data-i="'+i+'" title="Снять состояние"><span class="tt">'+esc(t.t)+'</span>'+(t.note?'<span class="tn">* '+esc(t.note)+'</span>':'')+'</button>';}).join('')+'</div>'+
    '</li>';
  }).join('');
  $('list').innerHTML = html || '<li class="empty">Список пуст</li>';
  $('round').textContent = S.round;

  var keepWho = $('who').value;
  var away = S.creatures.filter(function(c){return c.pc && !c.active;});
  $('absent').innerHTML = away.length ? '<span>Нет на игре:</span>' + away.map(function(c){return '<button data-back="'+c.id+'" title="Вернуть в бой">+ '+esc(c.name)+'</button>';}).join('') : '';
  $('who').innerHTML = present.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join('');
  if(keepWho && find(keepWho)) $('who').value = keepWho;


  save();
}

$('list').addEventListener('input', function(e){
  var li = e.target.closest('li'); if(!li || e.target.dataset.act!=='init') return;
  find(li.dataset.id).init = e.target.value; save();
});
$('absent').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  var c = find(b.dataset.back); if(c){ c.active = true; render(); }
});
$('list').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  var li = b.closest('li'); var c = find(li.dataset.id);
  if(b.dataset.act==='tag'){ c.tags.splice(+b.dataset.i,1); render(); }
  if(b.dataset.act==='del'){
    if(S.turn===c.id) S.turn = null;
    if(c.pc){ c.active = false; c.init = ''; c.tags = []; }
    else { S.creatures = S.creatures.filter(function(x){return x!==c;}); }
    render();
  }
});

function val(c){ return c.init===''||isNaN(+c.init) ? -Infinity : +c.init; }
$('sort').onclick = function(){
  var order = S.creatures.map(function(c){return c;});
  order.sort(function(a,b){
    if(a.active!==b.active) return a.active ? -1 : 1;
    var d = val(b)-val(a);
    return d===0||isNaN(d) ? order.indexOf(a)-order.indexOf(b) : d;
  });
  S.creatures = order; S.turn = null; S.round = 1; render();
};
$('next').onclick = function(){
  var act = S.creatures.filter(function(c){return c.active;});
  if(!act.length) return;
  var i = act.map(function(c){return c.id;}).indexOf(S.turn);
  if(i===-1){ S.turn = act[0].id; }
  else if(i===act.length-1){ S.turn = act[0].id; S.round++; }
  else { S.turn = act[i+1].id; }
  render();
};
$('newFight').onclick = function(){
  if(!confirm('Убрать неписей и обнулить инициативу и состояния?')) return;
  S.creatures = S.creatures.filter(function(c){return c.pc;});
  S.creatures.forEach(function(c){c.init='';c.tags=[];});
  S.turn = null; S.round = 1;
  $('cond').value = ''; $('tagNote').value = '';
  render();
};
$('addForm').onsubmit = function(e){
  e.preventDefault();
  var n = $('newName').value.trim(); if(!n) return;
  S.creatures.push({id:'n'+Date.now()+(S.seq++),name:n,pc:false,init:'',active:true,tags:[]});
  $('newName').value=''; render();
};
$('apply').onclick = function(){
  var c = find($('who').value), t = $('cond').value.trim();
  if(!c || !t) return;
  var note = $('tagNote').value.trim();
  var ex = c.tags.filter(function(x){return x.t===t;})[0];
  if(ex) ex.note = note; else c.tags.push({t:t,note:note});
  $('tagNote').value = ''; render();
};
function setupAC(inp, ul, items, onEnter){
  var idx = -1;
  function show(){
    var q = inp.value.trim().toLowerCase();
    var list = items.filter(function(n){return n.toLowerCase().indexOf(q)!==-1;});
    idx = -1;
    ul.innerHTML = list.map(function(n){return '<li>'+esc(n)+'</li>';}).join('');
    ul.hidden = !list.length;
  }
  function hide(){ ul.hidden = true; idx = -1; }
  function pick(t){ inp.value = t; hide(); }
  function mark(){ Array.prototype.forEach.call(ul.children, function(li,i){ li.classList.toggle('sel', i===idx); }); }
  inp.addEventListener('focus', show);
  inp.addEventListener('click', show);
  inp.addEventListener('input', show);
  inp.addEventListener('blur', hide);
  ul.addEventListener('mousedown', function(e){
    e.preventDefault();
    var li = e.target.closest('li'); if(li) pick(li.textContent);
  });
  inp.addEventListener('keydown', function(e){
    var open = !ul.hidden;
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      if(!open) show();
      var n = ul.children.length; if(!n) return;
      idx = e.key==='ArrowDown' ? (idx+1)%n : (idx-1+n)%n;
      mark();
    } else if(e.key==='Escape'){ hide(); }
    else if(e.key==='Enter'){
      if(open && idx>=0) pick(ul.children[idx].textContent);
      else { hide(); onEnter(); }
    }
  });
}
setupAC($('cond'), $('condList'), BASE, function(){ $('tagNote').focus(); });
setupAC($('tagNote'), $('acList'), NOTES, function(){ $('apply').click(); });
render();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
